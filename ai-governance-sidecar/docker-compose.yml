version: '3.8'

services:
  governance-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-governance-sidecar
    user: "0:0"
    ports:
      - "8080:8080"  # HTTP API
      - "8081:8081"  # gRPC (optional)
    volumes:
      # Mount COMPILED WASM binaries (not .rs source files)
      # Build policies first with: make policies
      - ./policies/wasm:/app/policies:ro
      - ./db:/app/db                       # Persistent audit database
    environment:
      - TOOL_UPSTREAM=${TOOL_UPSTREAM:-http://host.docker.internal:9000}
      - ENABLE_GRPC=${ENABLE_GRPC:-false}
      - POLICY_DIR=/app/policies
      - DB_PATH=/app/db/audit.db
      # - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - APPROVAL_TIMEOUT_MINUTES=${APPROVAL_TIMEOUT_MINUTES:-60}
      # Authentication (Optional)
      - REQUIRE_AUTH=true
      - JWT_SECRET=change-this-secret-in-production
      - AUTH_USERS=admin@example.com:admin:Administrator:admin,approver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - sidecar-net
    # Optional: Adding resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # React UI 
  governance-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: governance-ui
    ports:
      - "3000:80"  # UI accessible at http://localhost:3000
    depends_on:
      - governance-sidecar
    environment:
      - REACT_APP_API_URL=""
      - REACT_APP_WS_URL=""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - sidecar-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Automated simulation runner (runs once and exits)
  hospital-simulator:
    build:
      context: ./tools
      dockerfile: Dockerfile.simulator
    container_name: hospital-simulator
    depends_on:
      - governance-sidecar
      - governance-ui
    environment:
      - API_BASE=http://governance-sidecar:8080
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin
      - APPROVER_NAME=Automated System
      - STARTUP_DELAY=40
      - SIMULATION_DELAY=40
    networks:
      - sidecar-net
    restart: "no"  # Run once and exit
    profiles:
      - simulation  # Only runs when explicitly requested


networks:
  sidecar-net:
    driver: bridge